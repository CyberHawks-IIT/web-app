<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#e9e3d6"/>
  <!-- potato body -->
  <path d="M120 150
           C100 110, 150 70, 210 80
           C270 88, 320 120, 330 180
           C340 240, 320 300, 255 325
           C190 350, 120 335, 95 280
           C72 230, 95 185, 120 150 Z"
        fill="#c69a63" stroke="#9c733f" stroke-width="6"/>
  <!-- shading -->
  <path d="M255 325 C320 300, 340 240, 330 180 C326 155, 315 135, 300 120
           C325 170, 320 250, 260 300 C230 322, 190 330, 160 326
           C190 338, 225 336, 255 325 Z" fill="#b1854f" opacity=".6"/>
  <!-- eyes / spots -->
  <ellipse cx="180" cy="160" rx="10" ry="6" fill="#8a6333" transform="rotate(-25 180 160)"/>
  <ellipse cx="250" cy="200" rx="12" ry="7" fill="#8a6333" transform="rotate(15 250 200)"/>
  <ellipse cx="160" cy="250" rx="9" ry="6" fill="#8a6333" transform="rotate(10 160 250)"/>
  <ellipse cx="285" cy="260" rx="8" ry="5" fill="#8a6333" transform="rotate(-20 285 260)"/>
  <ellipse cx="210" cy="285" rx="10" ry="6" fill="#8a6333" transform="rotate(30 210 285)"/>
  <!-- a couple of sprout dots for character -->
  <circle cx="183" cy="158" r="2.5" fill="#5f4420"/>
  <circle cx="252" cy="199" r="2.5" fill="#5f4420"/>
</svg>
